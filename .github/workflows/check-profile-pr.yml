name: Check added profile link (if applicable)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if profile URLs changed
        id: changes
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          if git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD | grep -qx "scripts/profile_urls.txt"; then 
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: python3 -m pip install -r requirements.workflow.txt
      - name: Validate added/changed profiles (pull_request only)
        if: steps.changes.outputs.changed == 'true'
        run: python validate_profiles.py --changed-only
        working-directory: ./scripts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Validate all profiles (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: python validate_profiles.py
        working-directory: ./scripts
      - name: Upload profiles (dry run)
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: python upload_profiles.py --dry-run
        working-directory: ./scripts
